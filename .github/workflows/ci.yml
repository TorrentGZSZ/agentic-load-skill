name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:assets
      - run: npm run check:web-demo
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pack
      - run: npm run test:e2e:offline
